name: GitManual

on:
  workflow_dispatch:
    inputs:
      rss_url:
        description: "הכנס כתובת RSS של הפודקאסט"
        required: true
        type: string
      episodes_per_run:
        description: "כמה פרקים להוריד (1 = הפרק החדש ביותר)"
        required: true
        type: choice
        default: "5"
        options:
          - "1"
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
          - "40"
          - "100"
      episode_number:
        description: "מספר פרק ספציפי (אופציונלי). אם ריק או לא קיים - יורד האחרון"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: gitmanual
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run script
        env:
          RSS_URL: ${{ inputs.rss_url }}
          EPISODES_PER_RUN: ${{ inputs.episodes_per_run }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: python gitmanual.py

      - name: Load environment variables from Python
        run: |
          if [ -f env_output.env ]; then
            cat env_output.env >> "$GITHUB_ENV"
          fi

      - name: Zip into independent archives (max ~1.9GB each)
        if: env.DOWNLOADED_COUNT != '' && env.DOWNLOADED_COUNT != '0'
        run: |
          BASE="episodes_$(date +%Y%m%d_%H%M%S)"
          MAX=1900000000   # מתחת למגבלת 2GB של GitHub

          cd downloads
          part=1
          size=0
          files=()

          flush() {
            if [ ${#files[@]} -gt 0 ]; then
              # -0 = בלי דחיסה (קבצי אודיו כבר דחוסים)
              zip -0 -q "../${BASE}_part${part}.zip" "${files[@]}"
              part=$((part + 1))
              files=()
              size=0
            fi
          }

          for f in *; do
            [ -f "$f" ] || continue
            fsize=$(stat -c%s "$f")
            if [ $((size + fsize)) -gt "$MAX" ] && [ ${#files[@]} -gt 0 ]; then
              flush
            fi
            files+=("$f")
            size=$((size + fsize))
          done
          flush

          cd ..
          # אם יצא ZIP אחד בלבד - בלי הסיומת _part1
          if [ "$part" -eq 2 ]; then
            mv "${BASE}_part1.zip" "${BASE}.zip"
          fi

          echo "ZIP_BASE=$BASE" >> "$GITHUB_ENV"
          ls -lh "${BASE}"*.zip

      - name: Upload to GitHub Release
        if: env.DOWNLOADED_COUNT != '' && env.DOWNLOADED_COUNT != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RSS_URL: ${{ inputs.rss_url }}
        run: |
          NOTES="ארכיון פרקים של: ${PODCAST_TITLE}"$'\n'"RSS: ${RSS_URL}"

          if gh release view "$PODCAST_TAG" &>/dev/null; then
            gh release edit "$PODCAST_TAG" --title "$PODCAST_TITLE" --notes "$NOTES"
          else
            gh release create "$PODCAST_TAG" --title "$PODCAST_TITLE" --notes "$NOTES"
          fi

          # מעלה כל ZIP עצמאי (episodes_..._part1.zip, _part2.zip וכו')
          for f in "${ZIP_BASE}"*.zip; do
            echo "מעלה: $f"
            gh release upload "$PODCAST_TAG" "$f" --clobber
          done

      - name: Save state to Git
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gitmanual_seen.json
          git diff --cached --quiet || (
            git commit -m "Update podcast state" &&
            for i in {1..3}; do
              git pull --rebase && git push && break || sleep 5
            done
          )
